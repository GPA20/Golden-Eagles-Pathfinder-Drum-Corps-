        // Simple micro-interaction for gallery items
        document.querySelectorAll('.gallery-grid > div').forEach(item => {
            item.addEventListener('click', () => {
                item.classList.add('scale-95');
                setTimeout(() => {
                    item.classList.remove('scale-95');
                }, 150);
            });
        });

        // FAB interaction
        const fab = document.querySelector('button.fixed');
        fab.addEventListener('click', () => {
            const ripple = document.createElement('div');
            ripple.className = 'absolute inset-0 bg-white/20 rounded-full animate-ping';
            fab.appendChild(ripple);
            setTimeout(() => ripple.remove(), 500);
        });
