<div class="w-full max-w-md text-center mb-stack-lg">

<script>
        function selectRole(element, role) {
            // Remove selection from all buttons
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('role-selected', 'bg-secondary/10');
                btn.classList.add('bg-surface-container-low');
            });

            // Add selection to clicked button
            element.classList.add('role-selected', 'bg-secondary/10');
            element.classList.remove('bg-surface-container-low');

            // Handle the specific instrument dropdown
            const instrumentDropdown = document.getElementById('instrument-dropdown');
            if (role === 'instrumentalist') {
                instrumentDropdown.classList.remove('hidden');
                // Use a slight timeout to trigger potential transition
                setTimeout(() => instrumentDropdown.classList.add('block'), 10);
            } else {
                instrumentDropdown.classList.add('hidden');
                instrumentDropdown.classList.remove('block');
            }
        }

        // Horizontal Marquee Animation using JS for better control if needed
        const marqueeElements = document.querySelector('.animate-marquee');
        if (marqueeElements) {
            let offset = 0;
            function step() {
                offset -= 1;
                if (offset < -2000) offset = 0;
                marqueeElements.style.transform = `translateX(${offset}px)`;
                requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }
    </script>
<style>
        .animate-marquee {
            display: flex;
            width: max-content;
